[project]
name = "wenyi-eval"
version = "0.0.0"
description = "Isolated evaluation harness for Wenyi variants."
requires-python = ">=3.10"
dependencies = [
    "wenyi-core",
    "typer>=0.12",
    "rich>=13.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.6",
]

[tool.uv.sources]
wenyi-core = { path = "../../packages/core", editable = true }

# Keep this project out of the repository's uv workspace. The harness owns its
# own lock and environment and must not change the root uv.lock.
[tool.uv.workspace]
members = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wenyi_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "slow: exercises real CLI subprocesses and may take a minute",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
