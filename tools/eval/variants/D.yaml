# Group D: group C plus an explicit heterogeneous reflect.body route. Supply
# --heterogeneous-reflect-model naming a profile already defined in llm.models;
# the harness injects that route and proves the resolved reflect/polish model
# identities differ. No model ID or credential is invented here.
language:
  source: en
  target: zh
llm:
  preset: fake
pipeline:
  review: true
  polish: true
  reflective_polish: true
  reflect_min_severity: major
  reflect_clean_batches: polish
  book_understanding: true
  review_autofix: false
  prescan_concurrency: 1
  annotation_alignment_concurrency: 1
  review_concurrency: 1
  review_output_retries: 0
  review_agent_max_evidence_rounds: 0
  review_fix_max_rounds: 0
segment:
  max_tokens_per_batch: 1800
  max_tokens_per_segment: 1200
output:
  mono: true
  bilingual: false
  about_page: false
paths:
  state_dir: "/replace/with/absolute/disposable/eval/state/D"
