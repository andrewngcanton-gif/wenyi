# Candidate group A-prime template. The harness copies this file and replaces
# only paths.state_dir with a disposable absolute path. A_prime2 reuses it.
language:
  source: en
  target: zh
llm:
  preset: fake
pipeline:
  review: true
  polish: true
  book_understanding: true
  review_autofix: false
  prescan_concurrency: 1
  annotation_alignment_concurrency: 1
  review_concurrency: 1
  review_output_retries: 0
  review_agent_max_evidence_rounds: 0
  review_fix_max_rounds: 0
segment:
  max_tokens_per_batch: 1800
  max_tokens_per_segment: 1200
output:
  mono: true
  bilingual: false
  about_page: false
paths:
  state_dir: "/replace/with/absolute/disposable/eval/state/A_prime"
